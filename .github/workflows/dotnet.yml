name: .NET

on:
  push:
    branches: [ master, "feature/**" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ListenTogether.sln
      - name: Build
        run: dotnet build ListenTogether.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ListenTogether.sln --configuration Release --no-build --no-restore
      - name: Publish Windows desktop app
        run: dotnet publish src/ListenTogether.App/ListenTogether.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/publish
      - name: Package Windows desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/release/ListenTogether-win-x64.zip -Force
      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ListenTogether-win-x64
          path: artifacts/release/ListenTogether-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.production.yml config --quiet
      - name: Build relay container
        run: docker build --file src/ListenTogether.Server/Dockerfile --tag listen-together-server:test .
