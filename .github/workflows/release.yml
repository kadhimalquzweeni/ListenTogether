name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create"
        required: true
        default: "v0.1.0-preview"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ListenTogether.sln
      - name: Build
        run: dotnet build ListenTogether.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ListenTogether.sln --configuration Release --no-build --no-restore
      - name: Publish desktop app
        run: dotnet publish src/ListenTogether.App/ListenTogether.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/publish
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/release/ListenTogether-win-x64.zip -Force
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ListenTogether ${{ inputs.tag_name || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/release/ListenTogether-win-x64.zip
